name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker image
        run: docker build -t mi-app:${{ github.sha }} .
        
      - name: Save Docker image as artifact
        run: |
          docker save mi-app:${{ github.sha }} -o mi-app.tar
          echo "Docker image saved successfully"
        
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: mi-app.tar
          retention-days: 1

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load Docker image
        run: docker load -i mi-app.tar
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app:${{ github.sha }}'
          format: 'json'
          output: '${{ runner.temp }}/trivy-results.json'
          severity: 'CRITICAL,HIGH'
    
      - name: Upload Trivy results
        uses: actions/upload-artifact@v6
        with:
          name: trivy-results
          path: ${{ runner.temp }}/trivy-results.json

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: [build, trivy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load Docker image
        run: docker load -i mi-app.tar
      
      - name: Test Key Vault access
        run: |
          echo "Testing application Key Vault access..."
          echo "Docker version: $(docker --version)"
          echo "Image exists: $(docker image inspect mi-app:${{ github.sha }} > /dev/null 2>&1 && echo 'yes' || echo 'no')"
          
          echo ""
          echo "Attempting to run container..."
          docker run --rm \
            -e AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }} \
            -e AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }} \
            -e AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }} \
            -e KEY_VAULT_NAME=kv-devsecops-1 \
            -e SECRET_NAME=API-Key \
            mi-app:${{ github.sha }}