name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Build Docker image
        run: docker build -t mi-app:${{ github.sha }} .

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Ensure Docker image exists
        run: |
          if ! docker image inspect mi-app:${{ github.sha }} > /dev/null 2>&1; then
            echo "Image not found, building..."
            docker build -t mi-app:${{ github.sha }} .
          fi
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: [build, trivy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Test Key Vault access
        run: |
            echo "Testing application Key Vault access..."
            
            # Ejecutar el contenedor y capturar la salida
            OUTPUT=$(docker run --rm \
            -e AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
            -e AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
            -e AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
            -e KEY_VAULT_NAME="kv-devsecops-1" \
            -e SECRET_NAME="API-Key" \
            mi-app:${{ github.sha }} 2>&1)
            
            echo "Application output:"
            echo "$OUTPUT"
            echo ""
            
            # Verificar si el acceso fue exitoso
            if echo "$OUTPUT" | grep -q "Key Vault"; then
            echo "SUCCESS: Application successfully accessed Key Vault"
            
            # Extraer y mostrar solo los primeros caracteres del secreto
            SECRET_PREFIX=$(echo "$OUTPUT" | grep -o "El secreto es: [^']*" | cut -d' ' -f3- | head -c 20)
            echo "Secret value preview: $SECRET_PREFIX..."
            echo ""
            echo "Test PASSED: Application can access Key Vault secrets"
            else
            echo "FAILED: Could not confirm Key Vault access"
            if echo "$OUTPUT" | grep -q "Error"; then
                echo "Error detected in application output"
            fi
            exit 1
            fi

